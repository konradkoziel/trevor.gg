name: Deploy website

# The website (src/web + src/Web.Api) deploys on its own; .github/workflows/bot.yml deploys the bot
on:
  push:
    branches:
      - main
    paths:
      - 'src/web/**'
      - 'src/Web.Api/**'
      - 'src/Lol.Shared/**'
      - 'infra/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  RESOURCE_GROUP: trevor-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Test API
        run: |
          dotnet test tests/Lol.Shared.Tests --configuration Release
          dotnet test tests/Web.Api.Tests --configuration Release

      - name: Install, lint and test site
        working-directory: src/web
        run: |
          npm ci
          npm run lint
          npm test

      - name: Publish API
        run: dotnet publish src/Web.Api/Web.Api.csproj --configuration Release --output ./publish-api

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Creates the resources on the first run, then only applies changes from infra/web.bicep
      # Discord login stays off (503) while either Discord secret is missing, Riot linking without RIOT_API_KEY
      - name: Create or update Azure resources
        id: infra
        env:
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          # A repository variable, not a secret: the server id isn't secret, it just stays out of the code
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          # A repository variable too: how many recent games the stats keep per player (default 20, 1-100)
          MATCH_HISTORY_GAMES: ${{ vars.MATCH_HISTORY_GAMES }}
          # Shared with the bot, which gets it from bot.yml; without it /api/bot/... answers 503
          TREVOR_WEB_KEY: ${{ secrets.TREVOR_WEB_KEY }}
        run: |
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name website \
            --template-file infra/web.bicep \
            --parameters discordAppId="$DISCORD_APP_ID" discordClientSecret="$DISCORD_CLIENT_SECRET" riotApiKey="$RIOT_API_KEY" discordGuildId="$DISCORD_GUILD_ID" trevorWebKey="$TREVOR_WEB_KEY" \
              matchHistoryGames="${MATCH_HISTORY_GAMES:-20}" \
            --query properties.outputs --output json)
          for key in staticSiteName siteUrl apiName apiUrl discordRedirectUri; do
            echo "$key=$(jq -r ".$key.value" <<< "$outputs")" >> "$GITHUB_OUTPUT"
          done

      - name: Deploy API
        uses: azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.apiName }}
          package: ./publish-api
          sku: flexconsumption

      - name: Build site
        working-directory: src/web
        env:
          VITE_API_URL: ${{ steps.infra.outputs.apiUrl }}
        run: npm run build

      - name: Get Static Web App deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list \
            --resource-group "$RESOURCE_GROUP" \
            --name "${{ steps.infra.outputs.staticSiteName }}" \
            --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: src/web/dist
          skip_app_build: true

      - name: Summary
        run: |
          echo "Site: ${{ steps.infra.outputs.siteUrl }}" >> "$GITHUB_STEP_SUMMARY"
          echo "API: ${{ steps.infra.outputs.apiUrl }}/api/champions" >> "$GITHUB_STEP_SUMMARY"
          echo "Discord OAuth2 redirect: ${{ steps.infra.outputs.discordRedirectUri }}" >> "$GITHUB_STEP_SUMMARY"
