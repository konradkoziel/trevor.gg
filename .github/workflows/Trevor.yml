name: Deploy Azure Function

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
        id-token: write
        contents: read
    env:
      # Optional: without these the slash-command registration step is skipped
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish
        run: dotnet publish trevor.csproj --configuration Release --output ./publish

      - name: Logowanie do Azure za pomocą sekretów
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        uses: azure/functions-action@v1
        with:
          app-name: Trevor
          package: ./publish

      # Bulk overwrite of the app's global commands with discord/commands.json:
      # new commands appear, changed ones update, commands missing from the file are removed
      - name: Register Discord slash commands
        if: env.DISCORD_APP_ID != '' && env.DISCORD_BOT_TOKEN != ''
        run: |
          curl --fail-with-body -sS \
            -X PUT "https://discord.com/api/v10/applications/${DISCORD_APP_ID}/commands" \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @discord/commands.json
